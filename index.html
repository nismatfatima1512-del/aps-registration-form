<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APSACS Registration Form</title>

<style>

body{
    margin:0;
    background-color: #d1d5db;
    font-family:Arial, Helvetica, sans-serif;
}

header{
    background-color:#0a5c0a;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-area img{
    width:45px;
    height:45px;
    object-fit:contain;
}

.header-btn button{
    background:transparent;
    color:white;
    border:2px solid white;
    border-radius:20px;
    padding:6px 16px;
    margin-left:8px;
    margin-top: 3px;
    cursor:pointer;
}

/* FORM BOX */
.form-box{
    max-width:520px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:5px;
}

.section{
    margin-top:25px;
}

.section h3{
    background:#0a5c0a;
    color:white;
    padding:10px;
    border-radius:6px;
    font-size:16px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:12px;
}

input[type="text"],
input[type="tel"],
input[type="email"],
input[type="password"],
input[type="file"],
textarea{
    width:96%;
    padding:9px;
    margin-top:5px;
    margin-bottom:4px;
    border-radius:6px;
    border:1px solid #ccc;
    font: size 16px;
}

.photo-box{
    border:2px dashed #a3d3a3;
    padding:20px;
    text-align:center;
    border-radius:8px;
    margin-bottom:15px;
}

.note{
    font-size:12px;
    color:#555;
    margin-top:-8px;
    margin-bottom:10px;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.checkbox-row input{
    width:auto;
    margin:0;
}

.actions{
    text-align:center;
    margin-top:25px;
}

.actions button:enabled{
    padding:12px 35px;
    background:#0a5c0a;
    color:white;
    border:none;
    border-radius:25px;
    font-size:15px;
    cursor:pointer;
}

.actions button:disabled{
    padding:12px 35px;
    background:#ccc;
    color:#666;
    border:none;
    border-radius:25px;
    font-size:15px;
    cursor:not-allowed;
}

.actions button:hover{
    background:#084808;
}

input[type="text"],
input[type="tel"],
input[type="email"],
input[type="password"],
input[type="file"]{
    margin-bottom:4px;
}

#name-error,
#fathername-error,
#email-error,
#password-error,
#phone-error,
#image-error{
    display:block;
    margin-top:4px;
    margin-bottom:8px;
    font-size:12px;
    color:red;
}

label{
    margin-bottom:2px;
}

@media (max-width: 600px){

    header{
        flex-direction:column;
        text-align:center;
        gap:10px;
    }

    .header-btn{
        display:flex;
        gap:10px;
    }

    .form-box{
        margin:15px;
        padding:18px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="password"],
    input[type="file"],
    textarea{
        width:95%;
    }

    .actions button{
        width:100%;
        padding:14px;
    }

    h2{
        font-size:20px;
    }

    .section h3{
        font-size:14px;
    }
}

</style>

<script>

window.onload = function() {
    let button = document.getElementById('button');
    button.disabled = true;


    let username = document.getElementById('username');
    let nameError = document.getElementById('name-error');

    let fathername = document.getElementById('fathername');
    let fatherNameError = document.getElementById('fathername-error');

    let email = document.getElementById('email');
    let emailError = document.getElementById('email-error');

    let password = document.getElementById('password');
    let passwordError = document.getElementById('password-error');

    let phone = document.getElementById('phonenumber');
    let phoneError = document.getElementById('phone-error');

    let declaration = document.querySelector('.checkbox-row input');


    // NAME
    username.addEventListener('input', function() {
        let value = username.value;
        if (value === "") {
            nameError.innerText = "name is required!";
        } else if (value !== value.trimStart()) {
            nameError.innerText = "Name is invalid!";
        } else if (value.length < 3) {
            nameError.innerText = "name must be at least 3 characters long!";
        } else {
            nameError.innerText = "";
        }
        checkAllValid();
    });


    // FATHER NAME
    fathername.addEventListener('input', function() {
        let value = fathername.value;
        if (value === "") {
            fatherNameError.innerText = "Father name is required!";
        } else if (value !== value.trimStart()) {
            fatherNameError.innerText = "Father name is invalid!";
        } else if (value.length < 3) {
            fatherNameError.innerText = "Father name must be at least 3 characters long!";
        } else {
            fatherNameError.innerText = "";
        }
        checkAllValid();
    });


    // EMAIL
    email.addEventListener('input', function() {
        let value = email.value;
        if (value === "") {
            emailError.innerText = "Email is required!";
        } else if (!value.includes("@")) {
            emailError.innerText = "Please enter a valid email address!";
        } else if (!value.endsWith(".com")) {
            emailError.innerText = "Email is incorrect!";
        } else {
            emailError.innerText = "";
        }
        checkAllValid();
    });


    // PASSWORD
    password.addEventListener('input', function() {
        let value = password.value;
        let letters = (value.match(/[a-zA-Z]/g) || []).length;
        let numbers = (value.match(/[0-9]/g) || []).length;
        let specialChars = (value.match(/[@$!%*?&]/g) || []).length;
        if (value === "") {
            passwordError.innerText = "Password is required!";
        }else if (letters < 4) {
            passwordError.innerText = "Password must contain at least four letters!";
        } else if (numbers < 3) {
            passwordError.innerText = "Password must contain at least three numbers!";
        } else if (specialChars < 1) {
            passwordError.innerText = "Password must contain at least one special character!";
        } else if (value.length < 8) {
            passwordError.innerText = "Password must be at least 8 characters long!";
        }  else {
            passwordError.innerText = "";
        }
            checkAllValid();
    });


    // PHONE
    phone.addEventListener('input', function() {
        let value = phone.value;
        let allDigits = true;
        for (let i = 0; i < value.length; i++) {
            if (value[i] < '0' || value[i] > '9') {
                allDigits = false;
                break;
            }
        }
        if (value === "") {
            phoneError.innerText = "Phone number is required!";
        } else if (!allDigits) {
            phoneError.innerText = "Phone number must contain only digits!";
        } else if (value.length < 10) {
            phoneError.innerText = "Phone number must be at least 10 characters long!";
        } else if (value.length > 11) {
            phoneError.innerText = "Phone number is invalid!";
        } else {
            phoneError.innerText = "";
        }
        checkAllValid();
    });

    declaration.addEventListener('change', function() {
        checkAllValid();
    });


    function checkAllValid() {
    let nameOk = username.value.trim().length >= 3 && username.value === username.value.trimStart();
    let fatherOk = fathername.value.trim().length >= 3 && fathername.value === fathername.value.trimStart();
    let emailOk = email.value.includes("@") && email.value.endsWith(".com");
    
    let pass = password.value;
    let letters = (pass.match(/[a-zA-Z]/g) || []).length;
    let numbers = (pass.match(/[0-9]/g) || []).length;
    let specials = (pass.match(/[@$!%*?&]/g) || []).length;
    let passOk = letters >= 4 && numbers >= 3 && specials >= 1 && pass.length >= 8;

    let ph = phone.value;
    let allDigits = /^\d+$/.test(ph);
    let phoneOk = allDigits && ph.length >= 10 && ph.length <= 11;

    let declarationOk = declaration.checked;

    button.disabled = !(nameOk && fatherOk && emailOk && passOk && phoneOk && declarationOk);
}



    window.submitform = function() {

        let valid = true;
        
        

        // NAME CHECK
        if (username.value === "" || username.value.includes(" ") || username.value.length < 3) {
            valid = false;
        }

        // FATHER NAME CHECK
        if (fathername.value === "" || fathername.value.includes(" ") || fathername.value.length < 3) {
            valid = false;
        }

        // EMAIL CHECK
        if (email.value === "" || !email.value.includes("@") || !email.value.endsWith(".com")) {
            valid = false;
        }


        if (password.value === "" || password.value.length < 8) {
            valid = false;
           
        }

        if (phone.value === "" || phone.value.length < 10) {
            valid = false;
           
        }

        if (valid === true) {
            window.location.href = "index1.html";
           
        }
    }

}
</script>
</head>

<body>

<header>
    <div class="logo-area">
        <h1>APSACS</h1>
    </div>

    <div class="header-btn">
        <button>Sign up</button>
        <button>Sign in</button>
    </div>
</header>

<div class="form-box">

<h2>Registration Form</h2>
<p>Academic Year 2026–2027</p>

<form>

<div class="section">
<h3>Student Personal Information</h3>

<div class="photo-box">
<input type="file" id="image" accept="image/*">
<p id="image-error" style="color:red;font-size:12px;"></p>
<p><b>Passport Size Photo</b></p>
<p class="note">JPG/PNG, max 2MB</p>
</div>

<label>Student Name</label>
<p id="name-error" style="color:red;font-size:12px;"></p>
<input type="text" id="username" placeholder="Enter student name">

<label>Father Name</label>
<p id="fathername-error" style="color:red;font-size:12px;"></p>
<input type="text" id="fathername" placeholder="Enter father name">

<label>Email</label>
<p id="email-error" style="color:red;font-size:12px;"></p>
<input type="email" id="email" placeholder="Enter email">


<label>Password</label>
<p id="password-error" style="color:red;font-size:12px;"></p>
<input type="password" id="password" placeholder="Enter password">


<label>Phone Number</label>
<p id="phone-error" style="color:red;font-size:12px;"></p>
<input type="tel" id="phonenumber" placeholder="Enter phone number">


</div>

<div class="section">
<h3>Upload Documents</h3>

<label>CNIC / Passport</label>
<input type="file">

<label>Educational Certificate</label>
<input type="file">
</div>

<div class="section">
<h3>Declaration</h3>

<div class="checkbox-row">
<input type="checkbox" required>
<span>I declare that the information provided is correct.</span>
</div>
</div>

<div class="actions">
<button type="button" id="button" onclick="window.location.href='index1.html' ">Submit Registration</button>
</div>


</form>

</div>

</body>
</html>
