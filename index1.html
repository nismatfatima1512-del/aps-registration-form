<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Successful</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg, #e6f2e6, #cfe7cf);
    font-family:Arial, Helvetica, sans-serif;
}

/* SUCCESS CARD */
.success-box{
    background:white;
    padding:40px 35px;
    width:90%;
    max-width:420px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.15);
}

/* CHECK ICON */
.check-circle{
    width:90px;
    height:90px;
    background:#0a5c0a;
    color:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    margin:0 auto 20px;
}

.success-box h2{
    color:#0a5c0a;
    margin-bottom:10px;
}

.success-box p{
    color:#444;
    font-size:14px;
    line-height:1.6;
}

/* BUTTON */
.success-box button{
    margin-top:25px;
    padding:12px 30px;
    background:#0a5c0a;
    color:white;
    border:none;
    border-radius:25px;
    font-size:14px;
    cursor:pointer;
}

.success-box button:hover{
    background:#084808;
}

@media (max-width: 600px){

    .success-box{
        padding:25px 20px;
        margin:15px;
    }

    .check-circle{
        width:70px;
        height:70px;
        font-size:34px;
    }

    .success-box h2{
        font-size:20px;
    }

    .success-box p{
        font-size:13px;
    }

    .success-box button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="success-box">
    <div class="check-circle">✓</div>
    <h2>Registration Successful</h2>
    <p>
        Your registration form has been submitted successfully.<br>
        Our administration team will review your details and contact you shortly.
    </p>
    <button onclick="window.location.href='index.html'">
        Back to Home
    </button>
</div>

</body>
</html>
